name: Laravel CI/CD Pipeline

on: workflow_dispatch
# on:
#   push:
#   pull_request:
#     branches: [ main ]

jobs:
  setup-and-lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint Code
        run: ./vendor/bin/phpstan analyse --level=5 --no-progress

  test-and-simulate:
    name: Test Suite
    needs: setup-and-lint
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      APP_ENV: testing
      APP_KEY: base64:aeyk3cW1/014fA1N+Y6kR147h3jK9u8o5+l3y7z2=

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Restore Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run Feature Tests
        id: run_tests
        run: |
          echo "Starting Test Execution..."
          rm -rf .phpunit.cache
          ./vendor/bin/phpunit tests/Feature/ProductLifecycleTest.php --coverage-text --testdox > test_output.txt 2>&1
          cat test_output.txt

      - name: Final Summary
        if: always()
        run: |
          echo "Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "Status: All tasks completed successfully." >> $GITHUB_STEP_SUMMARY
            echo "Details:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: Pipeline Failed." >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs for more details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_output.txt
            storage/logs/
          if-no-files-found: ignore