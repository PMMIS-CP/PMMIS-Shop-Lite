name: Laravel CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  setup-and-lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Cache Composer Dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint Code (PHPStan)
        run: ./vendor/bin/phpstan analyse --level=5 --no-progress

  test-and-simulate:
    name: Test Suite
    needs: setup-and-lint
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      APP_ENV: testing
      APP_KEY: base64:aeyk3cW1/014fA1N+Y6kR147h3jK9u8o5+l3y7z2=

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Restore Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/logs
          touch database/database.sqlite

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Feature Tests
        run: php artisan test --filter=ProductLifecycleTest --coverage-text

      - name: Upload Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: storage/logs/