name: Laravel Tinker

on:
  workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: bcmath, ctype, fileinfo, json, mbstring, pdo, pdo_mysql, tokenizer, xml, curl
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Composer Dependencies
      run: composer install --no-interaction
    
    - name: Install Tinker
      run: composer require --dev laravel/tinker
    
    - name: Setup Environment
      run: |
        cp .env.example .env
        php artisan key:generate
    
    - name: Run Migrations
      run: php artisan migrate --force
    
    - name: Create Categories and Products with Tinker
      run: |
        php artisan tinker --execute='
          use App\Models\Category;
          use App\Models\Product;
          use Illuminate\Support\Facades\Cache;
          
          echo "STARTING DATA CREATION - " . date("Y-m-d H:i:s") . PHP_EOL;
          
          try {
            Cache::flush();
          } catch (Exception $e) {
            echo "Cache flush skipped: " . $e->getMessage() . PHP_EOL;
          }
          
          $categories = [
            ["name" => ["en" => "Electronics", "fa" => "الکترونیک"], "slug" => ["en" => "electronics", "fa" => "الکترونیک"], "is_active" => true, "sort_order" => 1],
            ["name" => ["en" => "Clothing", "fa" => "پوشاک"], "slug" => ["en" => "clothing", "fa" => "پوشاک"], "is_active" => true, "sort_order" => 2],
            ["name" => ["en" => "Books", "fa" => "کتابها"], "slug" => ["en" => "books", "fa" => "کتابها"], "is_active" => true, "sort_order" => 3],
            ["name" => ["en" => "Sports", "fa" => "ورزشی"], "slug" => ["en" => "sports", "fa" => "ورزشی"], "is_active" => true, "sort_order" => 4],
            ["name" => ["en" => "Home & Garden", "fa" => "خانه و باغ"], "slug" => ["en" => "home-garden", "fa" => "خانه-و-باغ"], "is_active" => true, "sort_order" => 5]
          ];
          
          $createdCategories = [];
          foreach ($categories as $catData) {
            $existing = Category::where("slug->en", $catData["slug"]["en"])->first();
            if (!$existing) {
              $cat = Category::create($catData);
              $createdCategories[] = $cat;
              echo "Created category: " . $cat->getTranslation("name", "en") . PHP_EOL;
            } else {
              $createdCategories[] = $existing;
              echo "Category exists: " . $existing->getTranslation("name", "en") . PHP_EOL;
            }
          }
          
          if (count($createdCategories) > 0) {
            $products = [
              ["category_id" => $createdCategories[0]->id, "sku" => "ELEC-001", "name" => ["en" => "Smartphone X", "fa" => "اسمارت فون ایکس"], "slug" => ["en" => "smartphone-x", "fa" => "اسمارت-فون-ایکس"], "price_usd" => 599.99, "stock" => 50, "is_active" => true, "is_featured" => true, "sort_order" => 1],
              ["category_id" => $createdCategories[0]->id, "sku" => "ELEC-002", "name" => ["en" => "Laptop Pro", "fa" => "لپ تاپ پرو"], "slug" => ["en" => "laptop-pro", "fa" => "لپ-تاپ-پرو"], "price_usd" => 1299.99, "stock" => 30, "is_active" => true, "is_featured" => true, "sort_order" => 2],
              ["category_id" => $createdCategories[1]->id, "sku" => "CLOTH-001", "name" => ["en" => "T-Shirt Classic", "fa" => "تی شرت کلاسیک"], "slug" => ["en" => "t-shirt-classic", "fa" => "تی-شرت-کلاسیک"], "price_usd" => 19.99, "stock" => 100, "is_active" => true, "is_featured" => false, "sort_order" => 1],
              ["category_id" => $createdCategories[1]->id, "sku" => "CLOTH-002", "name" => ["en" => "Jeans Blue", "fa" => "شلوار جین آبی"], "slug" => ["en" => "jeans-blue", "fa" => "شلوار-جین-آبی"], "price_usd" => 49.99, "stock" => 75, "is_active" => true, "is_featured" => false, "sort_order" => 2],
              ["category_id" => $createdCategories[2]->id, "sku" => "BOOK-001", "name" => ["en" => "Programming Guide", "fa" => "راهنمای برنامه نویسی"], "slug" => ["en" => "programming-guide", "fa" => "راهنمای-برنامه-نویسی"], "price_usd" => 39.99, "stock" => 40, "is_active" => true, "is_featured" => true, "sort_order" => 1],
              ["category_id" => $createdCategories[3]->id, "sku" => "SPORT-001", "name" => ["en" => "Football", "fa" => "توپ فوتبال"], "slug" => ["en" => "football", "fa" => "توپ-فوتبال"], "price_usd" => 29.99, "stock" => 60, "is_active" => true, "is_featured" => false, "sort_order" => 1],
              ["category_id" => $createdCategories[4]->id, "sku" => "HOME-001", "name" => ["en" => "Garden Tools Set", "fa" => "ست ابزار باغبانی"], "slug" => ["en" => "garden-tools-set", "fa" => "ست-ابزار-باغبانی"], "price_usd" => 89.99, "stock" => 25, "is_active" => true, "is_featured" => false, "sort_order" => 1]
            ];
            
            foreach ($products as $prodData) {
              try {
                $existing = Product::where("sku", $prodData["sku"])->first();
                if (!$existing) {
                  $prod = Product::create($prodData);
                  echo "Created product: " . $prod->getTranslation("name", "en") . " (SKU: " . $prod->sku . ")" . PHP_EOL;
                } else {
                  echo "Product exists: " . $existing->getTranslation("name", "en") . PHP_EOL;
                }
              } catch (Exception $e) {
                echo "Error creating product: " . $e->getMessage() . PHP_EOL;
              }
            }
          }
          
          echo "Total categories: " . Category::count() . PHP_EOL;
          echo "Total products: " . Product::count() . PHP_EOL;
          echo "DATA CREATION COMPLETED" . PHP_EOL;
        '
    
    - name: Build Vite Assets
      run: |
        if [ -f package.json ]; then
          npm ci
          npm run build
        else
          echo "No package.json found, creating dummy manifest"
          mkdir -p public/build
          echo '{}' > public/build/manifest.json
        fi
    
    - name: Start Laravel Server
      run: |
        echo "Starting Laravel Server..."
        php artisan serve --host=127.0.0.1 --port=8000 > server.log 2>&1 &
        sleep 10
        for i in 1 2 3 4 5; do
          if curl -s http://127.0.0.1:8000 > /dev/null 2>&1; then
            echo "Server ready"
            exit 0
          fi
          echo "Waiting for server... ($i/5)"
          sleep 3
        done
        echo "Server not ready after 25 seconds"
        exit 1
    
    - name: Browser Tests
      run: |
        php artisan tinker --execute='
          use App\Models\Category;
          use App\Models\Product;
          
          $timestamp = date("Y-m-d_H-i-s");
          $logDir = ".github/Logs";
          if (!is_dir($logDir)) mkdir($logDir, 0777, true);
          
          $baseUrl = "http://127.0.0.1:8000";
          
          echo "Testing base connection..." . PHP_EOL;
          $ch = curl_init();
          curl_setopt($ch, CURLOPT_URL, $baseUrl);
          curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
          curl_setopt($ch, CURLOPT_TIMEOUT, 10);
          $response = curl_exec($ch);
          $code = curl_getinfo($ch, CURLINFO_HTTP_CODE);
          curl_close($ch);
          echo "Base URL HTTP Status: " . $code . PHP_EOL;
          
          $allHtml = "<html><head><meta charset=\"UTF-8\"><title>Test Results</title></head><body>";
          $allHtml .= "<h1>Test Results - " . date("Y-m-d H:i:s") . "</h1>";
          $allHtml .= "<p>Base URL Status: HTTP " . $code . "</p>";
          
          $testResults = [];
          
          foreach (Category::active()->get() as $cat) {
            $slug = $cat->slug_en;
            $url = $baseUrl . "/category/" . $slug;
            echo "Testing category: " . $cat->getTranslation("name", "en") . " - " . $url . PHP_EOL;
            
            $ch = curl_init();
            curl_setopt($ch, CURLOPT_URL, $url);
            curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
            curl_setopt($ch, CURLOPT_TIMEOUT, 10);
            curl_setopt($ch, CURLOPT_FOLLOWLOCATION, true);
            $response = curl_exec($ch);
            $httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);
            curl_close($ch);
            
            $testResults[] = ["type" => "category", "name" => $cat->getTranslation("name", "en"), "status" => $httpCode];
            
            $html = "<h2>" . $cat->getTranslation("name", "en") . "</h2>";
            $html .= "<p>URL: " . $url . "</p>";
            $html .= "<p>HTTP: " . $httpCode . "</p>";
            if ($httpCode == 200) {
              $html .= "<pre>" . htmlspecialchars(substr($response, 0, 1500)) . "</pre>";
            } else {
              $html .= "<p class=\"error\">Error loading page - HTTP " . $httpCode . "</p>";
            }
            file_put_contents($logDir . "/category_" . $cat->id . "_" . $timestamp . ".html", $html);
            $allHtml .= $html;
          }
          
          foreach (Product::active()->take(5)->get() as $prod) {
            $slug = $prod->getTranslation("slug", "en");
            $url = $baseUrl . "/product/" . $slug;
            echo "Testing product: " . $prod->localized_name . " - " . $url . PHP_EOL;
            
            $ch = curl_init();
            curl_setopt($ch, CURLOPT_URL, $url);
            curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
            curl_setopt($ch, CURLOPT_TIMEOUT, 10);
            curl_setopt($ch, CURLOPT_FOLLOWLOCATION, true);
            $response = curl_exec($ch);
            $httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);
            curl_close($ch);
            
            $testResults[] = ["type" => "product", "name" => $prod->localized_name, "status" => $httpCode];
            
            $html = "<h2>" . $prod->localized_name . "</h2>";
            $html .= "<p>URL: " . $url . "</p>";
            $html .= "<p>HTTP: " . $httpCode . "</p>";
            $html .= "<p>SKU: " . $prod->sku . "</p>";
            $html .= "<p>Price: " . $prod->formatted_price . "</p>";
            if ($httpCode == 200) {
              $html .= "<pre>" . htmlspecialchars(substr($response, 0, 1500)) . "</pre>";
            } else {
              $html .= "<p class=\"error\">Error loading page - HTTP " . $httpCode . "</p>";
            }
            file_put_contents($logDir . "/product_" . $prod->id . "_" . $timestamp . ".html", $html);
            $allHtml .= $html;
          }
          
          $allHtml .= "<hr><h2>Summary</h2><ul>";
          foreach ($testResults as $tr) {
            $statusIcon = $tr["status"] == 200 ? "✅" : "❌";
            $allHtml .= "<li>$statusIcon " . $tr["type"] . ": " . $tr["name"] . " - HTTP " . $tr["status"] . "</li>";
          }
          $allHtml .= "</ul></body></html>";
          file_put_contents($logDir . "/complete_" . $timestamp . ".html", $allHtml);
          
          $failed = array_filter($testResults, function($tr) { return $tr["status"] != 200; });
          if (count($failed) > 0) {
            echo "FAILED: " . count($failed) . " tests failed" . PHP_EOL;
            exit(1);
          }
          echo "ALL TESTS PASSED" . PHP_EOL;
        '
    
    - name: Show Server Log
      if: always()
      run: |
        echo "========== SERVER LOG =========="
        cat server.log || echo "No server.log file"
        echo ""
        echo "========== CHECKING PORT 8000 =========="
        netstat -tlnp 2>/dev/null | grep 8000 || echo "Port 8000 not listening"
    
    - name: Upload All Files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs
        path: |
          .github/Logs/*.html
          server.log
        retention-days: 7